<div class="jbe-help-container jbe-help-container--full-width">
	<div>
		{{ sHelpText|nl2br }}
	</div>
	{% if aLinks is not empty %}
		<div class="jbe-help-container--links">
			{% for aLink in aLinks %}
				<a class="ibo-button ibo-is-regular ibo-is-{{ aLink.sType }}" href="{{ aLink.sUrl }}" target="_blank" rel="noopener noreferrer">
					<span class="ibo-button--icon {{ aLink.sIcon }}"></span>
					<span class="ibo-button--label">{{ aLink.sLabel }}</span>
				</a>
			{% endfor %}
		</div>
	{% endif %}
</div>
